# Windows Codex MCP example
# Merge only the blocks you need into %USERPROFILE%\.codex\config.toml.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true

# Docker Desktop MCP Toolkit gateway.
[mcp_servers.docker_toolkit]
command = "docker"
args = ["mcp", "gateway", "run", "--profile", "codex-dev"]
enabled = true

# Filesystem and Git MCP are intentionally omitted.
# Prefer Codex's native local file access and git CLI.
